name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build and test
        run: ./scripts/check.sh
      - name: Build and validate release app bundle
        run: ./scripts/build-appstore-app.sh
      - name: Visual regression
        run: ./scripts/visual-test.sh
      - name: Publication audit
        run: ./scripts/publication-audit.sh

  skia-product:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-skia
      - name: Skia build and tests
        run: caffeinate -d -u ./scripts/check.sh
      - name: Skia visual regression
        run: ./scripts/visual-test.sh
      - name: Native Skia archive
        run: |
          xcodebuild -project RunningOverlay.xcodeproj -scheme RunningOverlay -configuration Release -archivePath "$RUNNER_TEMP/RunningOverlay.xcarchive" SKIA_DIR="$SKIA_DIR" ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO archive
          python3 scripts/validate-packaged-skia.py "$RUNNER_TEMP/RunningOverlay.xcarchive/Products/Applications/RunningOverlay.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/RunningOverlay.xcarchive/Products/Applications/RunningOverlay.app"
      - name: Sandboxed archive template exports
        run: python3 scripts/smoke-skia-app.py "$RUNNER_TEMP/RunningOverlay.xcarchive/Products/Applications/RunningOverlay.app"
      - name: SwiftPM Skia bundle
        run: ./scripts/build-appstore-app.sh

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RunningOverlayResolve/package-lock.json
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          node --version
          npm --version
      - name: Build and test
        run: ./scripts/check.sh
      - name: Build and validate release app bundle
        run: ./scripts/build-appstore-app.sh
      - name: Visual regression
        run: ./scripts/visual-test.sh
      - name: Publication audit
        run: ./scripts/publication-audit.sh
